name: Flask CI

on:
  push:
    branches: [main, master]

jobs:

  test:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code  
        uses: actions/checkout@v2


      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: 3.12

      - name: Create virtual environment
        run: |
          python -m venv venv
          source venv/bin/activate

    
      - name: Run tests
        run: python -m unittest discover -s tests -p 'test_*.py'
                      