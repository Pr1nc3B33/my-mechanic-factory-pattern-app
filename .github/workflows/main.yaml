name: My Mechanic API

on:
  push:
    branches: [main, master] #Setting on Push to main branch, run our jobs


jobs: #The things we want to happen on push

  build:
    runs-on: ubuntu-latest #Ubuntu is a widely used linux distribution that is heavily supported and has alot of prebuilt Github actions

    steps:
      - name: Checkout Code
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: 3.12 #setting up python on our build environment
        
      - name: Create virtual Environment
        run: |
          python -m venv venv
          source venv/bin/activate

      - name: Install our Dependecies
        run: |
          python -m pip install --upgrade pip 
          python -m pip install -r requirements.txt

      - name: Print debugging information
        run: |
          echo "Python Version: $(python --version)"
          echo "Working Directory: $(pwd)"
          echo "Pip Version: $(pip --version)"


  test:
    runs-on: ubuntu-latest
    needs: build #dont run tests until the build passes

    steps:
      - name: Checkout Code
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: 3.12

      - name: Install our Dependecies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run Tests
        run: python -m pytest --tb=short -q


  deploy:
    runs-on: ubuntu-latest
    needs: test #only deploy if tests pass

    steps:
      - name: Deploy to Render
        run: |
          curl -X POST "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json"
